[env:teensy41]
platform = teensy@5.2.0
board = teensy41
framework = arduino
lib_deps =
    askuric/Simple FOC@2.3.4
    simplefoc/SimpleFOCDrivers@1.0.8
    SPI

; Iterations on the same source (src/main.cpp), kept so every result can be rebuilt:
; ff_raw: velocity feedforward from the STEP rate only (homing excites a 20 Hz limit cycle)
[env:teensy41_ff_raw]
extends = env:teensy41
build_flags = -DVEL_FF=1
; ff: + velocity clamp 200 rad/s and no PID output ramp
[env:teensy41_ff]
extends = env:teensy41
build_flags = -DVEL_FF=1 -DLOOP_FIX=1
; ff_fast: + unfiltered step-rate estimate (0.5 ms less delay)
[env:teensy41_ff_fast]
extends = env:teensy41
build_flags = -DVEL_FF=1 -DLOOP_FIX=1 -DFF_ALPHA=1.0f
; ff_fast_xy: the same drive and gains on X and Y from one Teensy (PINS.md)
[env:teensy41_ff_fast_xy]
extends = env:teensy41
build_flags = -DVEL_FF=1 -DLOOP_FIX=1 -DFF_ALPHA=1.0f -DDUAL_AXIS=1
